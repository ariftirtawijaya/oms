worker_processes 1;
pid /tmp/qa/nginx.pid;
error_log /tmp/qa/nginx_error.log;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /tmp/qa/nginx_access.log;
    client_body_temp_path /tmp/qa/body;
    proxy_temp_path /tmp/qa/proxy;
    fastcgi_temp_path /tmp/qa/fcgi;
    uwsgi_temp_path /tmp/qa/uwsgi;
    scgi_temp_path /tmp/qa/scgi;

    include /app/deploy/nginx/relaylab-oms-upstream.conf;

    server {
        listen 127.0.0.1:8100;
        root /tmp/qa/fe/build;
        index index.html;
        location /static/ { expires 1y; try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }

    server {
        listen 127.0.0.1:8088;
        location / { return 200 "LANDING\n"; }
        include /app/deploy/nginx/relaylab-oms-locations.conf;
        location /stock/ { return 200 "STOCK\n"; }
    }
}
