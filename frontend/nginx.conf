# Nginx di dalam kontainer frontend: hanya menyajikan file statis hasil build.
# Nginx utama VPS meneruskan https://relaylab.id/order/xxx -> http://127.0.0.1:8100/xxx (prefix /order dibuang).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
