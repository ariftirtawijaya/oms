# RelayLab OMS - upstream (level http).
# Salin ke: /etc/nginx/conf.d/relaylab-oms-upstream.conf
# File di conf.d otomatis di-include di dalam blok http {} oleh /etc/nginx/nginx.conf Ubuntu.
upstream relaylab_oms_frontend { server 127.0.0.1:8100; keepalive 8; }
upstream relaylab_oms_backend  { server 127.0.0.1:8101; keepalive 8; }
