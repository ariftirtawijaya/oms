# RelayLab OMS - blok location untuk /order/ dan /order/api/.
# Salin ke: /etc/nginx/snippets/relaylab-oms.conf
# Lalu tambahkan SATU baris berikut di dalam server {} HTTP dan HTTPS yang SUDAH ADA
# (yang melayani relaylab.id dan 103.247.9.189), tanpa mengubah location / dan /stock/:
#     include snippets/relaylab-oms.conf;
# ^~ membuat prefix /order/ menang atas location regex (mis. \.php$ milik /stock/ atau cache gambar).

location = /order { return 301 /order/; }

# API FastAPI: /order/api/xxx -> backend /api/xxx (prefix /order dibuang di sini)
location ^~ /order/api/ {
    proxy_pass http://relaylab_oms_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 10m;
}

# Frontend React statis: /order/xxx -> kontainer frontend /xxx.
# Refresh halaman (mis. /order/admin/orders/123) dijawab index.html oleh try_files di kontainer.
location ^~ /order/ {
    proxy_pass http://relaylab_oms_frontend/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
